name: tests
on: [push, pull_request]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m crypto_predictor --csv examples/synthetic.csv --lookback 10
      - run: python -m crypto_predictor --csv examples/synthetic.csv --model auto --output artifacts/search.json
      - run: docker build --target baseline -t crypto-predictor .
      - run: docker run --rm crypto-predictor
  lstm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-optional.txt
      - run: python -m crypto_predictor --csv examples/synthetic.csv --model lstm --lookback 10 --epochs 1 --horizon 2
